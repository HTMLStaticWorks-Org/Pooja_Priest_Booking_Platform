<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Sign in to PoojaConnect to manage your sacred ceremonies and priest bookings.">
  <title>Login | PoojaConnect</title>
  <!-- Dedicated Sacred Diya Favicon (Point 1) -->
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- AUTH PAGE WRAPPER WITHOUT NAVBAR (Point 16) -->
  <div class="auth-page-wrap">
    <!-- FLOATING TOP-RIGHT THEME & RTL BUTTONS (Point 16) -->
    <div class="auth-top-actions">
      <button class="icon-btn" data-rtl-toggle aria-label="Toggle right to left">RTL</button>
      <button class="icon-btn" data-theme-toggle>☾ Theme</button>
    </div>

    <!-- AUTHENTICATION CARD -->
    <div class="auth-card">
      <!-- BRAND NAME INSIDE CARD (Point 16) -->
      <div class="auth-card-logo">
        <a class="logo" href="index.html">
          <span class="logo-mark">ॐ</span>
          <span>PoojaConnect</span>
        </a>
      </div>

      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to continue planning your sacred moments.</p>

      <!-- SOCIAL MEDIA LOGIN BUTTONS (Point 17) -->
      <div class="social-auth-grid">
        <button type="button" class="social-auth-btn" aria-label="Sign in with Google">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.97 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          Google
        </button>

        <button type="button" class="social-auth-btn" aria-label="Sign in with Apple">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.92-2.85-.9.04-2 .6-2.65 1.35-.58.67-1.09 1.74-.95 2.77.99.08 2.03-.51 2.68-1.27z"/>
          </svg>
          Apple
        </button>
      </div>

      <div class="auth-divider">
        <span>or sign in with email</span>
      </div>

      <!-- FORM -->
      <form data-demo>
        <label for="email">Email Address</label>
        <input id="email" type="email" required placeholder="you@example.com">

        <label for="password">Password</label>
        <!-- PASSWORD FIELD WITH SVG EYE ICON (Point 17) -->
        <div class="password-wrap">
          <input id="password" type="password" required placeholder="Enter your password">
          <button class="show-pass-btn" type="button" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
          </button>
        </div>

        <!-- CHECKBOX & FORGOT PASSWORD (Point 17) -->
        <div class="checkbox-row">
          <label class="checkbox-label">
            <input type="checkbox" id="remember" name="remember">
            <span>Remember me</span>
          </label>
          <a href="#" style="color:var(--brand);font-weight:700;font-size:0.88rem">Forgot password?</a>
        </div>

        <button class="btn" type="submit" style="width:100%;margin-top:20px;height:46px">Sign in to Account</button>
        <p class="form-message muted" role="status" style="margin-top:10px"></p>
      </form>

      <div class="auth-links">
        New to PoojaConnect? <a href="signup.html">Create an account</a><br>
        <a href="index.html" style="display:inline-block;margin-top:12px;font-size:0.88rem">← Back to home</a>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
