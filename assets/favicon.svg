  </defs>
  <!-- Background circle for contrast -->
  <circle cx="32" cy="32" r="30" fill="#2d150b" />
  <circle cx="32" cy="32" r="28" fill="none" stroke="#e0953a" stroke-width="1.5" stroke-dasharray="2,2" />
  
