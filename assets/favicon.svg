  <circle cx="32" cy="22" r="16" fill="url(#flameGlow)" />
  
  <!-- Flame -->
  <path d="M32 8 C29 15 25 19 25 25 C25 29.5 28 33 32 33 C36 33 39 29.5 39 25 C39 19 35 15 32 8 Z" fill="url(#flameGrad)" />
