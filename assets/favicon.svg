<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="flameGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fff7b2" />
      <stop offset="45%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="flameGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fff8e1" />
      <stop offset="30%" stop-color="#ffc107" />
      <stop offset="70%" stop-color="#ff6f00" />
      <stop offset="100%" stop-color="#d84315" />
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="40%" stop-color="#ffb300" />
      <stop offset="75%" stop-color="#f57c00" />
      <stop offset="100%" stop-color="#b26a00" />
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb300" />
      <stop offset="100%" stop-color="#8d4b00" />
