  <path d="M32 17 C30.8 20.5 29 23 29 26.5 C29 28.5 30.3 30.5 32 30.5 C33.7 30.5 35 28.5 35 26.5 C35 23 33.2 20.5 32 17 Z" fill="#ffffff" opacity="0.9" />
  
  <!-- Brass Diya Bowl -->
  <path d="M14 33 C18 45 46 45 50 33 C46 36 38 38 32 38 C26 38 18 36 14 33 Z" fill="url(#brassGrad)" />
  <ellipse cx="32" cy="33.5" rx="17.5" ry="3.5" fill="#e65100" opacity="0.4" />
  
  <!-- Diya Stem / Pedestal -->
  <path d="M28 42 L36 42 L35 48 L29 48 Z" fill="url(#brassGrad)" />
  
  <!-- Diya Base -->
